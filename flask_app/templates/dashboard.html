{% extends "base.html" %}

{% block titulo %}Dashboard{% endblock %}

{% block contenido %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Aplicación</a>
        <a href="/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm p-5">
        <h1 class="display-5 text-primary">¡Bienvenido(a), {{ usuario.nombre }} {{ usuario.apellido }}!</h1>
        <p class="lead text-secondary">Has iniciado sesión correctamente.</p>
        <hr>
        <p><strong>ID de Usuario:</strong> {{ usuario.id }}</p>
        <p><strong>Email:</strong> {{ usuario.email }}</p>
    </div>
</div>
{% endblock %}
